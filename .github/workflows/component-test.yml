name: component-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  barge-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg (mic capture path)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install --omit=dev --no-fund --no-audit
      - name: Run component tests (fake mic, captured speakers, scripted Realtime server)
        run: npm test
